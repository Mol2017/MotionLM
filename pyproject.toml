[project]
name = "motionlm"
version = "0.1.0"
description = "Reproduction of MotionLM: Multi-Agent Motion Forecasting as Language Modeling (Seff et al., ICCV 2023)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "zstandard>=0.22",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "data", "viz", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
